name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx wrangler deploy --dry-run --outdir dist

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Access config lives in GitHub secrets and gets pushed to the Worker on every deploy.
      - run: |
          [ -n "$ACCESS_AUD" ] && [ -n "$ACCESS_TEAM_DOMAIN" ] || { echo "::warning::ACCESS_AUD/ACCESS_TEAM_DOMAIN not set; /admin stays locked"; exit 0; }
          jq -n '{ACCESS_AUD: env.ACCESS_AUD, ACCESS_TEAM_DOMAIN: env.ACCESS_TEAM_DOMAIN}' > secrets.json
          npx wrangler secret bulk secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
