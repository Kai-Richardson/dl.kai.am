<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dl.kai.am admin</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 960px; margin: 2rem auto; padding: 0 1.5rem; }
  form { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; margin-bottom: 1.5rem; }
  form input, form select, form button { font: inherit; font-size: 1.05rem; padding: .55rem .75rem; border-radius: 6px; }
  form button { cursor: pointer; }
  input[type=url], input[type=file] { flex: 1 1 320px; }
  input[type=file] { padding: .35rem; }
  input[type=file]::file-selector-button { font: inherit; padding: .45rem .75rem; border-radius: 6px; margin-right: .6rem; cursor: pointer; }
  input[name=slug] { width: 11rem; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: .35rem .5rem; border-bottom: 1px solid #8884; }
  /* only the target wraps; slug, size, expiry and the delete button stay on one line */
  td:nth-child(1), td:nth-child(3), td:nth-child(4), td:nth-child(5) { white-space: nowrap; }
  td:nth-child(3), td:nth-child(4) { color: #999; font-size: .9em; }
  td:nth-child(3), th:nth-child(3) { text-align: right; }
  td:nth-child(2) { overflow-wrap: anywhere; width: 100%; }
  #status { min-height: 1.5em; }
  .error { color: #d33; }
</style>
</head>
<body>
<h1>dl.kai.am</h1>

<h2>Shorten a link</h2>
<form id="link-form">
  <input type="url" name="url" placeholder="https://…" required maxlength="800" aria-label="URL">
  <input name="slug" placeholder="slug (optional)" pattern="[A-Za-z0-9_-]{1,64}" aria-label="Custom slug">
  <button type="button" class="random">Random</button>
  <select name="expiry" aria-label="Expires"><option value="">Never expires</option><option value="1d">1 day</option><option value="7d">1 week</option><option value="30d">30 days</option></select>
  <button>Shorten</button>
</form>

<h2>Upload a file</h2>
<form id="file-form">
  <input type="file" name="file" required aria-label="File">
  <input name="slug" placeholder="slug (optional)" pattern="[A-Za-z0-9_-]{1,64}" aria-label="Custom slug">
  <button type="button" class="random">Random</button>
  <select name="expiry" aria-label="Expires"><option value="">Never expires</option><option value="1d">1 day</option><option value="7d">1 week</option><option value="30d">30 days</option></select>
  <button>Upload</button>
</form>

<p id="status" role="status"></p>

<h2>Links</h2>
<table>
  <thead><tr><th>Slug</th><th>Target</th><th>Size</th><th>Expires</th><th></th></tr></thead>
  <tbody id="links"></tbody>
</table>

<script>
const PART_SIZE = 50 * 1024 * 1024; // R2 parts must be ≥5 MB (except the last); Worker bodies cap at 100 MB
const statusEl = document.getElementById("status");
const setStatus = (msg, error = false) => { statusEl.textContent = msg; statusEl.className = error ? "error" : ""; };

async function api(path, opts = {}) {
  const res = await fetch("/admin/api/" + path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
const post = (path, body) => api(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });

const SLUG_CHARS = "abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";
for (const btn of document.querySelectorAll(".random")) {
  btn.onclick = () => {
    btn.previousElementSibling.value = Array.from(crypto.getRandomValues(new Uint8Array(7)), (b) => SLUG_CHARS[b % SLUG_CHARS.length]).join("");
  };
}

async function done(slug) {
  const url = location.origin + "/" + slug;
  await navigator.clipboard.writeText(url).catch(() => {});
  setStatus("Copied " + url);
  load();
}

document.getElementById("link-form").onsubmit = async (e) => {
  e.preventDefault();
  const f = e.target;
  try {
    const { slug } = await post("links", { url: f.url.value, slug: f.slug.value || undefined, expiry: f.expiry.value || undefined });
    f.reset();
    done(slug);
  } catch (err) { setStatus(err.message, true); }
};

document.getElementById("file-form").onsubmit = async (e) => {
  e.preventDefault();
  const f = e.target;
  const file = f.file.files[0];
  let up;
  try {
    up = await post("uploads", { filename: file.name, contentType: file.type, slug: f.slug.value || undefined, expiry: f.expiry.value || undefined });
    const q = "?key=" + encodeURIComponent(up.key);
    const parts = [];
    const count = Math.max(1, Math.ceil(file.size / PART_SIZE));
    for (let i = 0; i < count; i++) {
      setStatus(`Uploading ${file.name}: part ${i + 1}/${count}`);
      const chunk = file.slice(i * PART_SIZE, (i + 1) * PART_SIZE);
      parts.push(await api(`uploads/${up.uploadId}/${i + 1}${q}`, { method: "PUT", body: chunk }));
    }
    const { slug } = await post(`uploads/${up.uploadId}/complete${q}`, { parts });
    f.reset();
    done(slug);
  } catch (err) {
    setStatus(err.message, true);
    if (up) api(`uploads/${up.uploadId}?key=${encodeURIComponent(up.key)}`, { method: "DELETE" }).catch(() => {});
  }
};

async function load() {
  const links = await api("links");
  links.sort((a, b) => b.created - a.created);
  const tbody = document.getElementById("links");
  tbody.replaceChildren(...links.map((l) => {
    const tr = document.createElement("tr");
    const slug = document.createElement("td");
    const a = document.createElement("a");
    a.href = "/" + l.slug; a.textContent = l.slug;
    slug.append(a);
    const target = document.createElement("td");
    target.textContent = l.type === "file" ? `file: ${l.filename}` : l.target;
    const size = document.createElement("td");
    size.textContent = l.type !== "file" ? "—" : l.size < 1048576 ? `${(l.size / 1024).toFixed(2)} KB` : `${(l.size / 1048576).toFixed(2)} MB`;
    const expires = document.createElement("td");
    expires.textContent = l.expires ? new Date(l.expires).toLocaleDateString() : "—";
    const actions = document.createElement("td");
    const del = document.createElement("button");
    del.textContent = "Delete";
    del.onclick = async () => {
      if (!confirm("Delete " + l.slug + "?")) return;
      try { await api("links/" + encodeURIComponent(l.slug), { method: "DELETE" }); load(); }
      catch (err) { setStatus(err.message, true); }
    };
    actions.append(del);
    tr.append(slug, target, size, expires, actions);
    return tr;
  }));
}
load().catch((err) => setStatus(err.message, true));
</script>
</body>
</html>
